version: '3.1'
intents:
- adjust
- get_status
entities:
- parameter
- device
- location
- query
- amount
slots:
  location:
    type: categorical
    values:
    - basement
    - main floor
    - upstairs
    - outside
    - upstairs
    - master bedroom
    - guest bedroom
    - kitchen
    - dining room
    - living room
    - downstairs
    - office
    mappings:
    - type: from_entity
      entity: location
  parameter:
    type: categorical
    values:
    - temperature
    - brightness
    - color
    - humidity
    - position
    - volume
    - speed
    - occupancy
    mappings:
    - type: from_entity
      entity: parameter
  device:
    type: text
    mappings:
    - type: from_entity
      entity: device
  amount:
    type: text
    mappings:
    - type: from_entity
      entity: amount
  amount_val:
    type: float
    mappings:
    - type: custom
  amount_type:
    type: categorical
    values:
    - absolute
    - relative
    mappings:
    - type: custom
  query:
    type: text
    mappings:
    - type: from_entity
      entity: query
forms:
  adjust_form:
    required_slots:
    - location
    - device
    - parameter
    - amount
    - amount_type
    - amount_val
  query_parameter_form:
    required_slots:
    - query
    - location
    - device
    - parameter
  query_filter_form:
    required_slots:
    - query
    - location
    - device
    - parameter
    - amount
    - amount_type
    - amount_val
actions:
- action_submit_adjust
- action_submit_query_parameter
- action_submit_filter
- validate_adjust_form
- validate_query_parameter_form
- validate_filter_form
responses:
  utter_done:
  - text: Done.
  utter_ask_location:
  - text: What room do you want to adjust?
  utter_ask_parameter:
  - text: What do you want to change?
  utter_ask_device:
  - condition:
    - type: slot
      name: amount
      value: on
    text: Which device do you want to turn {amount}?
  - condition:
    - type: slot
      name: amount_type
      value: absolute
    text: Sure, which device do you want to set to {amount}?
  - text: Sure, which device do you want to adjust?
  utter_ask_amount:
  - text: How would you like to adjust the {device}?
  utter_response_count:
  - text: there are currently {answer_num} {device} {amount} {location}
  utter_response_single:
  - text: the {location} {device} is currently set to {amount}
  utter_action_complete:
  - text: Set {device} to {amount}. Anything else?
  utter_unknown:
  - text: Sorry, I'm not sure how to do that.
  utter_confirm:
  - text: Was that right?
session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
