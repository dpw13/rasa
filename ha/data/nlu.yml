version: "3.1"
nlu:
- intent: adjust
  examples: |
    - turn [up](amount) the [temperature](parameter)
    - turn [down](amount) the [fan](device)
    - turn [down](amount) the [fan](device) [speed](parameter)
    - can you [mute](amount) the [volume](parameter) on the [TV](device)?
    - can you turn [up](amount) the [stereo](device)?
    - turn [off](amount) the [lights](device)
    - set the [lights](device) to [20 percent](amount)
    - set the [brightness](device) [upstairs](location) to [50 percent](amount)
    - turn [on](amount) the party [lights](device)
    - turn [off](amount) the [living room](location) [fan](device)
    - turn [on](amount) the [lights](device) in the [basement](location)
    - turn [up](amount) the [lights](device) in my [office](location)
    - turn [on](amount) the [fairy lights](device)
    - turn [on](amount) [all](location) the [lights](device)
    - turn [off](amount) the [fan](device) in the [kitchen](location)
    - turn [down](amount) the [outside](location) [lights](device)
    - set the [living room](location) [fan](device) [speed](parameter) to [5](amount)
    - set the [basement](location) [temperature](parameter) to [75](amount)
    - set the [basement](location) [temperature](parameter) to [78](amount)
    - turn [up](amount) the [brightness](parameter) in the [living room](location)
- intent: get_status
  examples: |
    - [what's](query) the [temperature](parameter) [upstairs](location)?
    - [what's](query) the [volume](parameter) set to?
    - [are any](query) [lights](device) on?
    - [is there](query) [anybody]{"entity": "parameter", "value": "occupancy"} [downstairs](location)?
    - [what is](query) the [humidity](parameter) in the [bathroom](location)?
    - [how many](query) [lights](device) are [on](amount) [downstairs](location)?
    - [is](query) the [living room](location) [occupied]{"entity": "parameter", "value": "occupancy"}?
    - [what is](query) the [thermostat](device) set to?
    - [what is](query) the [temperature](parameter) in the [living room](location)?
    - [what is](query) the [living room](location) [brightness](parameter) set to?
    - [what's](query) the [basement](location) [temperature](parameter)?
    - [what is](query) the [basement](location) [thermostat](device) set to?
    - [what is](query) the [living room](location) [thermostat](device) set to?
- intent: affirm
  examples: |
    - yes
    - yep
    - indeed
    - of course
    - that sounds good
    - correct
    - sure
    - please
- intent: deny
  examples: |
    - no
    - nah
    - no thanks
    - hush
    - stop
    - go away
    - nevermind
    - quit
    - exit
- synonym: occupancy
  examples: |
    - anybody
    - occupied
