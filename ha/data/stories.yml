version: "3.1"

stories:

# Adjust

- story: set fan
  steps:
  - intent: adjust
    entities:
      - device: fan
      - amount: up
  - action: adjust_form
  - action: action_submit_adjust

- story: set lights
  steps:
  - intent: adjust
    entities:
      - device: lights
      - amount: on
  - action: adjust_form
  - action: action_submit_adjust

- story: set room lights
  steps:
  - intent: adjust
    entities:
      - device: lights
      - location: upstairs
      - amount: off
  - action: adjust_form
  - action: action_submit_adjust

- story: set temp
  steps:
  - intent: adjust
    entities:
      - parameter: temperature
      - amount: 68
      - location: living room
  - action: adjust_form
  - action: action_submit_adjust

# Status

- story: get lights on
  steps:
  - intent: get_status
    entities:
      - query: how many
      - device: lights
      - amount: on
      - location: downstairs
  - action: query_filter_form
  - action: action_submit_filter

- story: is the living room occupied
  steps:
  - intent: get_status
    entities:
      - query: is
      - location: living room
      - parameter: occupancy
  - action: query_parameter_form
  - action: action_submit_query_parameter

- story: what's the basement temp
  steps:
  - intent: get_status
    entities:
      - query: what's
      - location: basement
      - parameter: temperature
  - action: query_parameter_form
  - action: action_submit_query_parameter

- story: what is the living room fan
  steps:
  - intent: get_status
    entities:
      - query: what is
      - location: living room
      - device: fan
  - action: query_parameter_form
  - action: action_submit_query_parameter

